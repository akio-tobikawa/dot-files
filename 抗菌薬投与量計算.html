<html lang="ja">
<head>
<meta charset="utf-8">
<title>抗菌薬投与量リファレンス（疾患・腎機能別）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --warn: #f0a020;
    --danger: #e15050;
    --ok: #4ade80;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --panel2: #f1f3f7;
      --border: #d8dde6;
      --text: #1a1d24;
      --muted: #5b6473;
      --accent: #2156c9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    font-size: 14px; line-height: 1.55;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0 0 6px 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .tabs {
    display: flex; gap: 4px; margin-top: 10px;
  }
  .tab {
    padding: 6px 14px; border-radius: 6px 6px 0 0;
    background: var(--panel2); color: var(--muted);
    border: 1px solid var(--border); border-bottom: none;
    cursor: pointer; font-size: 13px;
  }
  .tab.active { background: var(--panel); color: var(--text); font-weight: 600; }
  main { padding: 16px 20px 60px; max-width: 1280px; margin: 0 auto; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 14px;
  }
  input[type="search"], select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px;
  }
  input[type="search"] { min-width: 220px; flex: 1; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card h3 {
    margin: 0 0 6px 0; font-size: 15px;
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .card .meta { color: var(--muted); font-size: 12px; font-weight: normal; }
  .card .alias { color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px;
    border-radius: 10px; background: var(--panel2); color: var(--muted);
    border: 1px solid var(--border);
  }
  .badge.cls { background: rgba(110,168,254,0.12); color: var(--accent); border-color: rgba(110,168,254,0.3); }
  table.dose {
    width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px;
  }
  table.dose th, table.dose td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
    vertical-align: top;
  }
  table.dose th {
    background: var(--panel2); color: var(--muted); font-weight: 600;
    white-space: nowrap;
  }
  table.dose td.normal { white-space: nowrap; font-weight: 600; }
  .notes {
    margin-top: 8px; padding: 8px 10px; background: var(--panel2);
    border-left: 3px solid var(--accent); border-radius: 4px;
    font-size: 12.5px; color: var(--text);
  }
  .notes.warn { border-left-color: var(--warn); }
  .source { margin-top: 6px; color: var(--muted); font-size: 11px; }
  .empiric-list { margin: 6px 0 0; padding-left: 20px; }
  .empiric-list li { margin-bottom: 4px; }
  .disclaimer {
    background: rgba(240,160,32,0.1); border: 1px solid rgba(240,160,32,0.4);
    color: var(--text); padding: 10px 14px; border-radius: 6px;
    margin-bottom: 14px; font-size: 12.5px;
  }
  .disclaimer strong { color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
  @media (max-width: 700px) {
    table.dose { font-size: 12px; }
    table.dose th, table.dose td { padding: 4px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>抗菌薬投与量リファレンス</h1>
  <div class="sub">疾患・腎機能別の経験的投与量参考（Sanford Guide 準拠）</div>
  <div class="tabs">
    <div class="tab active" data-tab="drug">薬剤から探す</div>
    <div class="tab" data-tab="disease">疾患から探す</div>
  </div>
</header>
<main>
  <div class="disclaimer">
    <strong>⚠ 注意</strong>
    本データは <em>Sanford Guide to Antimicrobial Therapy</em> を主たる出典とした学習・参照用リファレンスです。
    実際の処方は最新の Sanford Guide・各薬剤添付文書・施設プロトコル・患者個別要因（体重、肝機能、PK/PD、相互作用、感受性結果等）に基づき判断してください。
    本ツールの使用に起因する一切の臨床判断・転帰について責任を負いません。
  </div>

  <!-- 薬剤タブ -->
  <section id="tab-drug">
    <div class="controls">
      <input id="drug-search" type="search" placeholder="薬剤名・略号・系統で検索（例: PIPC, バンコ, カルバペネム）">
      <select id="drug-class">
        <option value="">系統すべて</option>
      </select>
      <span class="count" id="drug-count"></span>
    </div>
    <div id="drug-list"></div>
  </section>

  <!-- 疾患タブ -->
  <section id="tab-disease" class="hidden">
    <div class="controls">
      <input id="disease-search" type="search" placeholder="疾患名で検索（例: 肺炎, 髄膜炎, FN, 蜂窩織炎）">
      <select id="disease-cat">
        <option value="">カテゴリすべて</option>
      </select>
      <span class="count" id="disease-count"></span>
    </div>
    <div id="disease-list"></div>
  </section>
</main>

<script>

// ======================================================================
// レンダリング
// ======================================================================
const renalCols = [">50", "30-50", "15-29", "<15", "HD", "CRRT"];

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

function renderDrugCard(d) {
  const card = el("div", { class: "card" });
  const h = el("h3", {});
  h.append(d.name);
  h.append(el("span", { class: "badge cls" }, d.cls));
  card.append(h);
  if (d.aliases) card.append(el("div", { class: "alias" }, "別名/略号: " + d.aliases));

  const tbl = el("table", { class: "dose" });
  const thead = el("thead");
  const trh = el("tr");
  trh.append(el("th", {}, "通常用量"));
  for (const c of renalCols) trh.append(el("th", {}, "CrCl " + c));
  thead.append(trh);
  tbl.append(thead);

  const tbody = el("tbody");
  const tr = el("tr");
  tr.append(el("td", { class: "normal" }, d.normal));
  for (const c of renalCols) tr.append(el("td", {}, d.renal[c] || "—"));
  tbody.append(tr);
  tbl.append(tbody);
  card.append(tbl);

  if (d.notes) card.append(el("div", { class: "notes" }, d.notes));
  card.append(el("div", { class: "source" }, "出典: Sanford Guide to Antimicrobial Therapy（参考）"));
  return card;
}

function renderDiseaseCard(dz) {
  const card = el("div", { class: "card" });
  const h = el("h3", {});
  h.append(dz.name);
  h.append(el("span", { class: "badge" }, dz.cat));
  card.append(h);
  const ul = el("ul", { class: "empiric-list" });
  for (const r of dz.empiric) ul.append(el("li", {}, r));
  card.append(ul);
  if (dz.notes) card.append(el("div", { class: "notes" }, dz.notes));
  card.append(el("div", { class: "source" }, "出典: Sanford Guide to Antimicrobial Therapy（参考）"));
  return card;
}

function normalize(s) {
  return (s || "").toString().toLowerCase();
}

function applyDrugFilter() {
  const q = normalize(document.getElementById("drug-search").value);
  const cls = document.getElementById("drug-class").value;
  const list = document.getElementById("drug-list");
  list.innerHTML = "";
  let n = 0;
  for (const d of drugs) {
    if (cls && d.cls !== cls) continue;
    const hay = normalize(d.name + " " + d.aliases + " " + d.cls);
    if (q && !hay.includes(q)) continue;
    list.append(renderDrugCard(d));
    n++;
  }
  document.getElementById("drug-count").textContent = n + " 薬剤";
}

function applyDiseaseFilter() {
  const q = normalize(document.getElementById("disease-search").value);
  const cat = document.getElementById("disease-cat").value;
  const list = document.getElementById("disease-list");
  list.innerHTML = "";
  let n = 0;
  for (const d of diseases) {
    if (cat && d.cat !== cat) continue;
    const hay = normalize(d.name + " " + d.cat + " " + d.empiric.join(" ") + " " + (d.notes || ""));
    if (q && !hay.includes(q)) continue;
    list.append(renderDiseaseCard(d));
    n++;
  }
  document.getElementById("disease-count").textContent = n + " 疾患";
}

function initFilters() {
  const clsSel = document.getElementById("drug-class");
  const classes = [...new Set(drugs.map(d => d.cls))].sort();
  for (const c of classes) clsSel.append(el("option", { value: c }, c));

  const catSel = document.getElementById("disease-cat");
  const cats = [...new Set(diseases.map(d => d.cat))];
  for (const c of cats) catSel.append(el("option", { value: c }, c));

  document.getElementById("drug-search").addEventListener("input", applyDrugFilter);
  document.getElementById("drug-class").addEventListener("change", applyDrugFilter);
  document.getElementById("disease-search").addEventListener("input", applyDiseaseFilter);
  document.getElementById("disease-cat").addEventListener("change", applyDiseaseFilter);

  for (const t of document.querySelectorAll(".tab")) {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      const tab = t.dataset.tab;
      document.getElementById("tab-drug").classList.toggle("hidden", tab !== "drug");
      document.getElementById("tab-disease").classList.toggle("hidden", tab !== "disease");
    });
  }
}

initFilters();
applyDrugFilter();
applyDiseaseFilter();
